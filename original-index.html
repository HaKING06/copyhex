      darkMode: 'class',

        extend: {
          colors: {
            brand: {
              500: '#6366f1',

            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes toastSlide {
      0% { transform: translateY(12px) scale(0.96); opacity: 0; }
      15% { transform: translateY(0) scale(1); opacity: 1; }
      85% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-10px) scale(0.96); opacity: 0; }
    }
    .toast-anim {
      animation: toastSlide 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* İnce kaydırma çubuğu */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {

      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {

    }

    // HEX'ten RGB'ye dönüştürme fonksiyonu
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) {
        c = c.split('').map(ch => ch + ch).join('');
      }
      const num = parseInt(c, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgb(${r}, ${g}, ${b})`;
    }

    // Renklerin parlaklığına göre kontrastlı yazı rengi (Siyah/Beyaz) belirleme
    function getContrastColor(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) {
        c = c.split('').map(ch => ch + ch).join('');
      }
      const r = parseInt(c.substring(0, 2), 16);
      const g = parseInt(c.substring(2, 4), 16);
      const b = parseInt(c.substring(4, 6), 16);
      // YIQ parlaklık formülü
      const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      return (yiq >= 140) ? '#0f172a' : '#ffffff';
    }

    // Tüm renk veri tabanını zenginleştirme
    const colors = rawColors.map(c => ({
      ...c,
      rgb: hexToRgb(c.hex),
      contrast: getContrastColor(c.hex)
    }));

    // Durum Değişkenleri
    let currentCategory = "Tümü";
    let searchQuery = "";
    let activeFormat = "HEX"; // HEX veya RGB

    const categories = ["Tümü", "Kırmızı", "Turuncu", "Sarı", "Yeşil", "Mavi", "Mor", "Pembe", "Kahverengi", "Nötr"];

    const grid = document.getElementById("color-grid");
    const emptyState = document.getElementById("empty-state");
    const counterEl = document.getElementById("counter");
    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search");
    const categoryContainer = document.getElementById("category-filters");
    const currentFormatSpan = document.getElementById("current-format");

    // Kategori butonlarını oluştur
    function renderCategories() {
      categoryContainer.innerHTML = categories.map(cat => {
        const isActive = cat === currentCategory;
        const activeClass = isActive 
          ? "bg-indigo-600 text-white font-semibold shadow-md shadow-indigo-600/30" 
          : "bg-slate-900 text-slate-400 hover:text-slate-200 hover:bg-slate-800 border border-slate-800";
        return `
          <button 
            onclick="setCategory('${cat}')"
            class="px-3.5 py-1.5 rounded-lg transition-all whitespace-nowrap ${activeClass}"
          >
            ${cat}
          </button>
        `;
      }).join("");
    }

    // Kartları Listeleme
    function renderColors() {
      const q = searchQuery.trim().toLowerCase();
      
      const filtered = colors.filter(c => {
        const matchesCategory = currentCategory === "Tümü" || c.cat === currentCategory;
        const matchesSearch = !q || 
          c.name.toLowerCase().includes(q) || 
          c.hex.toLowerCase().includes(q) || 
          c.rgb.toLowerCase().includes(q) ||
          c.cat.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      counterEl.textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove("hidden");
        emptyState.classList.add("flex");
        return;
      }

      emptyState.classList.add("hidden");
      emptyState.classList.remove("flex");

      grid.innerHTML = filtered.map(color => {
        const copyValue = activeFormat === "HEX" ? color.hex : color.rgb;
        return `
          <div 
            onclick="copyText('${copyValue}', '${color.name}')"
            tabindex="0"
            role="button"
            aria-label="${color.name} rengini kopyala"
            class="group relative bg-slate-900 border border-slate-800/90 hover:border-indigo-500/50 rounded-2xl p-2.5 transition-all duration-200 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10 cursor-pointer flex flex-col focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <!-- Renk Önizleme Kutusu -->
            <div 
              class="w-full h-28 rounded-xl relative flex items-center justify-center shadow-inner transition-transform group-hover:scale-[1.02]"
              style="background-color: ${color.hex};"
            >
              <div 
                class="opacity-0 group-hover:opacity-100 transition-opacity bg-black/40 backdrop-blur-xs text-xs font-medium px-2.5 py-1 rounded-full text-white shadow-sm"
              >
                Kopyala
              </div>
            </div>

            <!-- Bilgiler -->
            <div class="px-2 pt-3 pb-1 flex flex-col gap-1">
              <div class="flex items-center justify-between">
                <span class="font-semibold text-sm text-slate-100 group-hover:text-indigo-300 transition-colors">
                  ${color.name}
                </span>
                <span class="text-[10px] text-slate-400 font-medium px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700/50">
                  ${color.cat}
                </span>
              </div>
              
              <div class="flex items-center justify-between text-xs font-mono text-slate-400 mt-1">
                <span class="${activeFormat === 'HEX' ? 'text-indigo-400 font-semibold' : ''}">${color.hex}</span>
                <span class="text-[11px] truncate max-w-[120px] ${activeFormat === 'RGB' ? 'text-indigo-400 font-semibold' : 'text-slate-500'}">${color.rgb}</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // Arama Olayları
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      if (searchQuery.length > 0) {
        clearSearchBtn.classList.remove("hidden");
      } else {
        clearSearchBtn.classList.add("hidden");
      }
      renderColors();
    });

    function clearSearch() {
      searchInput.value = "";
      searchQuery = "";
            clearSearchBtn.classList.add("hidden");
      renderColors();
    }

    // Kategori seçimi
    function setCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderColors();
    }

    // Filtreleri sıfırlama (boş durum butonu için)
    function resetFilters() {
      currentCategory = "Tümü";
      clearSearch();
      renderCategories();
      renderColors();
    }

    // HEX / RGB gösterim formatı değiştirici
    function toggleFormat() {
      activeFormat = activeFormat === "HEX" ? "RGB" : "HEX";
      currentFormatSpan.textContent = activeFormat;
      renderColors();
    }

    // Panoya kopyalama ve geri bildirim bildirimi (Toast)
    async function copyText(text, colorName) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(text, colorName);
      } catch (err) {
        // Eski tarayıcılar için fallback kopyalama
        const fallbackInput = document.createElement("input");
        fallbackInput.value = text;
        document.body.appendChild(fallbackInput);
        fallbackInput.select();
        document.execCommand("copy");
        document.body.removeChild(fallbackInput);
        showToast(text, colorName);
      }
    }

    function showToast(value, name) {
      const toast = document.createElement("div");
      toast.className = "toast-anim flex items-center gap-3 bg-slate-900 text-slate-100 border border-slate-700/80 px-4 py-3 rounded-xl shadow-2xl backdrop-blur-md";
      toast.innerHTML = `
        <span class="w-3.5 h-3.5 rounded-full inline-block border border-white/20 shrink-0" style="background-color: ${value}"></span>
        <div class="text-xs">
          <strong class="text-white">${name}</strong> (${value}) panoya kopyalandı!
        </div>
      `;

      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 2000);
    }

    // Klavye erişilebilirliği: Enter ve Boşluk tuşu ile kartları tetikleme
    grid.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        const card = e.target.closest("[role='button']");
        if (card) {
          e.preventDefault();
          card.click();
        }
      }
    });

    // İlk yükleme ve başlangıç render'ı
    renderCategories();
    renderColors();
  </script>
</body>
</html>
