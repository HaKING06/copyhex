<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>Check color contrast before using a palette</title><desc>Black on white has a contrast ratio of 21 to 1. Similar pale colors can fail text contrast requirements.</desc><rect width="1200" height="650" rx="24" fill="#151722"/><g font-family="Arial,sans-serif"><text x="55" y="75" fill="#f7f5ff" font-size="32" font-weight="700">CopyHex</text><text x="55" y="135" fill="#f7f5ff" font-size="36">Beautiful colors. Readable combinations.</text><rect x="55" y="205" width="525" height="270" rx="16" fill="#fff"/><text x="90" y="285" fill="#000" font-size="42" font-weight="700">Readable by design.</text><text x="90" y="350" fill="#000" font-size="22">#000000 on #FFFFFF</text><text x="90" y="425" fill="#18573e" font-size="25">21.00:1 / AA + AAA PASS</text><rect x="605" y="205" width="540" height="270" rx="16" fill="#eee"/><text x="640" y="285" fill="#ccc" font-size="42" font-weight="700">Check before you use.</text><text x="640" y="350" fill="#ccc" font-size="22">Similar lightness reduces readability.</text><text x="640" y="425" fill="#853c4c" font-size="25">Review text / background pairs</text><text x="55" y="545" fill="#aaa8bf" font-size="21">Normal text: AA 4.5:1 / AAA 7:1</text><text x="55" y="600" fill="#aaa8bf" font-size="18">copyhex.haking.tr</text></g></svg>
