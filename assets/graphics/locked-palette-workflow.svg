<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>Build a color palette with locked colors</title><desc>A starting lilac color stays locked while two alternative harmonious palettes vary around it.</desc><rect width="1200" height="650" rx="24" fill="#151722"/><g font-family="Arial,sans-serif"><text x="55" y="70" fill="#f7f5ff" font-size="32" font-weight="700">CopyHex</text><text x="55" y="128" fill="#f7f5ff" font-size="36">Keep what works. Explore the rest.</text><text x="55" y="175" fill="#aaa8bf" font-size="19">Lock your starting color. Regenerate the unlocked swatches.</text><g transform="translate(55 225)"><rect width="205" height="270" rx="12" fill="#8b7cf8"/><text x="25" y="50" fill="#19152d" font-size="20">LOCKED</text><text x="25" y="235" fill="#19152d" font-size="23">#8B7CF8</text><path d="M230 135h60M270 120l20 15-20 15" fill="none" stroke="#aaa8bf" stroke-width="3"/><g transform="translate(320)"><rect width="150" height="120" rx="9" fill="#8b7cf8"/><rect x="160" width="150" height="120" rx="9" fill="#b7d7c5"/><rect x="320" width="150" height="120" rx="9" fill="#f5ebd5"/><rect x="480" width="150" height="120" rx="9" fill="#3e4355"/><rect y="150" width="150" height="120" rx="9" fill="#8b7cf8"/><rect x="160" y="150" width="150" height="120" rx="9" fill="#edb7a5"/><rect x="320" y="150" width="150" height="120" rx="9" fill="#c8c8e8"/><rect x="480" y="150" width="150" height="120" rx="9" fill="#3a304a"/></g></g><text x="55" y="585" fill="#aaa8bf" font-size="18">copyhex.haking.tr / palette-generator</text></g></svg>
